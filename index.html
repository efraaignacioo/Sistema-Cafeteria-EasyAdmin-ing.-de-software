<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú de la Cafetería</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="mobile-screen">
        
        <div class="content-wrapper"> 
            <header id="menu-header" style="text-align: center; margin-bottom: 20px;">
                <h1 id="main-menu-title" style="font-size: 28px; margin: 10px 0 5px 0;">Cargando Título...</h1>
                <img id="header-image" src="" alt="Decoración del Menú" style="max-width: 100%; height: auto; max-height: 100px; display: none;">
            </header>

            <main id="menu-container">
                </main>
            
            <footer>
                <button class="view-cart-button">Ver carrito</button>
            </footer>
        </div>
        
    </div>
    <div id="cart-modal" class="modal-overlay" style="display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:999; justify-content:center; align-items:center;">
        <div style="padding:20px; border-radius:15px; width:85%; max-width:350px;">
            <h2 style="margin-top:0;">Tu Pedido</h2>
            <div id="table-info" style="font-weight:bold; margin-bottom:10px;"></div>
            <ul id="cart-items-list" style="padding-left:20px; margin-bottom:20px;"></ul>
            <div style="display:flex; justify-content:space-between;">
                <button id="close-cart" style="border:none; padding:10px; border-radius:8px;">Cerrar</button>
                <button id="place-order-btn" style="color:white; border:none; padding:10px; border-radius:8px; font-weight:bold;">¡Pedir!</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>

</body>
</html>
