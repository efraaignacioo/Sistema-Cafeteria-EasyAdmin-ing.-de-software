services:
  # ----------------------------------------------------
  # 1. Microservicio de Productos
  # ----------------------------------------------------
  product-service:
    build:
      context: ./product-service
      dockerfile: Dockerfile
    container_name: product-service
    ports:
      - "8000:8000"
    volumes:
      - ./product-service:/app
    depends_on:
      - db
    environment:
      MYSQL_USER: easyadmin_user
      MYSQL_PASSWORD: password_segura
      MYSQL_DATABASE: easyadmin_db
      MYSQL_HOST: db
      
  # ----------------------------------------------------
  # 2. Microservicio de Pedidos
  # ----------------------------------------------------
  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    container_name: order-service
    ports:
      - "8001:8000"
    volumes:
      - ./order-service:/app
    depends_on:
      - db
    environment:
      MYSQL_USER: easyadmin_user
      MYSQL_PASSWORD: password_segura
      MYSQL_DATABASE: easyadmin_db
      MYSQL_HOST: db

  # ----------------------------------------------------
  # 3. Base de Datos
  # ----------------------------------------------------
  db:
    image: mysql:8.0
    container_name: mysql_db
    environment:
      MYSQL_ROOT_PASSWORD: root_password_segura
      MYSQL_USER: easyadmin_user
      MYSQL_PASSWORD: password_segura
      MYSQL_DATABASE: easyadmin_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

# ----------------------------------------------------
# Volúmenes para persistencia
# ----------------------------------------------------
volumes:
  mysql_data:
