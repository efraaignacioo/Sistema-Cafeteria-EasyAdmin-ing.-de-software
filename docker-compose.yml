

services:
  # ----------------------------------------------------
  # 1. Microservicio de Productos
  # ----------------------------------------------------
  product-service:
    build:
      context: ./product-service
      dockerfile: Dockerfile
    container_name: product-service
    ports:
      - "8000:8000" # Acceso al API desde el navegador
    #volumes:
     # - ./product-service:/app # Para desarrollo en tiempo real
    depends_on:
      - db
    
    # 🚨 CORRECCIÓN CLAVE: Pasamos las variables de entorno a FastAPI
    environment:
      MYSQL_USER: easyadmin_user
      MYSQL_PASSWORD: password_segura
      MYSQL_DATABASE: easyadmin_db # Ajustado a 'easyadmin_db'
      MYSQL_HOST: db               # ¡Clave! 'db' es el nombre del servicio de MySQL
      
  # ----------------------------------------------------
  # 2. Base de Datos (MySQL) - ¡Tu elección!
  # ----------------------------------------------------
  db:
    image: mysql:8.0
    container_name: mysql_db
    environment:
      # Las variables que usa MySQL para inicializar la BD
      MYSQL_ROOT_PASSWORD: root_password_segura # Contraseña para el usuario root (Docker la necesita)
      MYSQL_USER: easyadmin_user
      MYSQL_PASSWORD: password_segura
      MYSQL_DATABASE: easyadmin_db # Ajustado a 'easyadmin_db'
    ports:
      - "3306:3306" # Puerto estándar de MySQL
    volumes:
      - mysql_data:/var/lib/mysql # Persistencia de datos

# ----------------------------------------------------
# Volúmenes para persistencia
# ----------------------------------------------------
volumes:
  mysql_data: