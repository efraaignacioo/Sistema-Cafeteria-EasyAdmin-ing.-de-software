<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Cajero</title>
    <link rel="stylesheet" href="cajero.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <h1>Punto de Venta (Cajero) - EasyAdmin</h1>
        <button id="logout-button">Cerrar Sesión</button>
    </header>

    <main class="pos-layout">
        
        <section class="card" id="create-order">
            <h2>Crear Nuevo Pedido</h2>
            <section class="card" id="create-order">
    <h2>Crear Nuevo Pedido</h2>

    <form id="create-order-form">

        <div class="form-group">
            <label for="menu-products">Seleccionar Producto:</label>
            <select id="menu-products">
                <option value="">Cargando productos...</option>
            </select>
            <button type="button" id="add-to-cart-button">Añadir al Carrito</button>
        </div>

        <div class="form-group">
            <label>Carrito de Pedido:</label>
            <ul id="cart-list">
                </ul>
        </div>

        <div class="form-group">
            <label for="table-number">Número de Mesa:</label>
            <input type="number" id="table-number" min="1" required>
        </div>

        <button type="submit" class="button-link">Crear Pedido</button>
        <p id="create-order-message"></p>
    </form>
    </section>
        </section>

        <section class="card" id="order-list-container">
            <h2>Historial de Pedidos</h2>
            <div id="order-list">
                </div>
        </section>
        
    </main>

    <script src="cajero.js"></script>
</body>
</html>
